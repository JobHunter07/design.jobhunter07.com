name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './storybook-static'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test the deployed site
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          # A green deploy is not proof: with Pages in legacy mode a Jekyll
          # build can overwrite this artifact and serve the repo README instead.
          for attempt in $(seq 1 10); do
            index=$(curl -s -o /dev/null -w '%{http_code}' "${SITE}index.json")
            iframe=$(curl -s -o /dev/null -w '%{http_code}' "${SITE}iframe.html")
            echo "attempt $attempt: index.json=$index iframe.html=$iframe"
            if [ "$index" = "200" ] && [ "$iframe" = "200" ]; then
              count=$(curl -s "${SITE}index.json" | jq '.entries | length')
              echo "Storybook is live with $count stories."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deployed site is not serving Storybook (index.json=$index, iframe.html=$iframe)."
          echo "Most likely cause: GitHub Pages Source is not 'GitHub Actions'."
          echo "See docs/DEPLOYMENT.md."
          exit 1
